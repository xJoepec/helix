[project]
name = "helixenv"
description = "Operator-algebra diagnostics (AF partitions) evaluation environment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "verifiers>=0.1.3.post0",
  "datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helixenv"]

[tool.hatch.build.targets.sdist]
include = [
  "helixenv",
  "pyproject.toml",
]



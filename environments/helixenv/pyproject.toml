[project]
name = "helixenv"
description = "Operator-algebra diagnostics (AF partitions) evaluation environment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "helix @ git+https://github.com/xJoepec/helix.git",
  "verifiers>=0.1.3.post0",
  "datasets",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false
packages = [
  "helixenv",
  "helixenv.af_partition",
  "helixenv.cp_dilation",
  "helixenv.ulam_flow",
]

[tool.setuptools.package-dir]
helixenv = "."

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]



[project]
name = "helixenv"
description = "Helix concepts MCQ evaluation environment (verifiers-based)"
version = "0.1.0"
requires-python = ">=3.11"
authors = [{ name = "Project Helix" }]
license = { text = "MIT" }
keywords = ["helix", "operator-algebras", "evaluation", "mcq", "verifiers"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "verifiers>=0.1.3",
  "datasets>=2.14.0",
]

[project.scripts]
helixenv-cli = "environments.helixenv.cli:main"

[project.urls]
"Homepage" = "https://github.com/primeintellect-ai/helix"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["helixenv.py", "README.md"]

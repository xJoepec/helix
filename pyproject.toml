[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Operator-algebraic diagnostics for deep nets (AF partitions, CP maps, Ulam PF)."
readme = "code/helix/README.md"
requires-python = ">=3.9"
authors = [
  { name = "Project Helix" }
]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
]
keywords = ["operator-algebras", "machine-learning", "diagnostics", "AF", "CP maps", "Ulam"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
torch = ["torch"]
sympy = ["sympy"]
plot = ["matplotlib"]
tui = [
  "textual>=0.58",
  "torch",  # required for demo computation
  "platformdirs>=4.0",  # cross-platform config directory support
  "toml>=0.10",  # config file format
]
dev = [
  "ruff>=0.5",
  "pytest>=7",
]

[project.scripts]
helix = "helix.cli:main"
helix-tui = "helix.tui:main"

[tool.setuptools]
package-dir = {"" = "code"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["code"]
include = ["helix*"]

[tool.setuptools.package-data]
"helix" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I"]
ignore = []


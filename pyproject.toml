[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helix"
version = "0.1.0"
description = "Operator-algebraic diagnostics for deep nets (AF partitions, CP maps, Ulam PF)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Project Helix" }
]
license = { text = "MIT" }
dependencies = [
  "numpy>=1.23",
]
keywords = ["operator-algebras", "machine-learning", "diagnostics", "AF", "CP maps", "Ulam"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
# Individual components
torch = ["torch>=2.0"]
sympy = ["sympy>=1.12"]
viz = ["matplotlib>=3.5", "networkx>=2.8"]
topology = ["ripser>=0.6"]

# Installation profiles
minimal = ["scipy>=1.10"]  # Just core functionality with scipy

standard = [
  "helix[minimal]",
  "helix[viz]",
  "helix[topology]",
]

full = [
  "helix[standard]",
  "helix[torch]",
  "textual>=0.58",
  "platformdirs>=4.0",
  "toml>=0.10",
]

tui = [
  "textual>=0.58",
  "torch>=2.0",  # required for demo computation
  "platformdirs>=4.0",  # cross-platform config directory support
  "toml>=0.10",  # config file format
]

research = [
  "helix[full]",
  "helix[sympy]",
  "jupyter>=1.0",
  "ipython>=8.0",
]

dev = [
  "helix[full]",
  "ruff>=0.5",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "mypy>=1.0",
  "sphinx>=6.0",
  "hypothesis>=6.0",
]

[project.scripts]
helix = "helix.cli:main"
helix-tui = "helix.tui:main"

[tool.setuptools]
package-dir = {"" = "code"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["code"]
include = ["helix*"]

[tool.setuptools.package-data]
"helix" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I"]
ignore = []

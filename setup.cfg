[metadata]
name = helix
version = 0.1.0
description = Operator-algebraic diagnostics for deep nets
long_description = file: reference/README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
package_dir =
    = code
python_requires = >=3.9
install_requires =
    numpy>=1.23

[options.packages.find]
where = code
include = helix*

[options.entry_points]
console_scripts =
    helix = helix.cli:main


